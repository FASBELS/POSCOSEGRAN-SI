[alembic]
script_location = migrations
prepend_sys_path = src
path_separator = os
; La URL se toma de POSCOSEGRAN_BD_URL_MIGRACIONES en migrations/env.py.
; No se escribe aquí para no dejar credenciales en el repositorio.
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = consola

[formatters]
keys = generico

[logger_root]
level = WARNING
handlers = consola
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_consola]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generico

[formatter_generico]
format = %(levelname)-5.5s [%(name)s] %(message)s
