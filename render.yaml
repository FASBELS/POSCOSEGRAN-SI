databases:
  - name: poscosegran-db
    databaseName: poscosegran
    user: poscosegran
    region: ohio
    plan: free
    postgresMajorVersion: "16"

services:
  - type: web
    name: poscosegran-api
    runtime: docker
    region: ohio
    plan: free
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    dockerCommand: sh -c "python scripts/render_prepare.py && uvicorn poscosegran.api.app:crear_app --factory --host 0.0.0.0 --port 10000"
    healthCheckPath: /salud/bd
    autoDeployTrigger: commit
    envVars:
      - key: POSCOSEGRAN_ENTORNO
        value: produccion
      - key: POSCOSEGRAN_BD_URL_APP
        fromDatabase:
          name: poscosegran-db
          property: connectionString
      - key: POSCOSEGRAN_BD_URL_MIGRACIONES
        fromDatabase:
          name: poscosegran-db
          property: connectionString
      - key: POSCOSEGRAN_JWT_MODO
        value: JWKS
      - key: POSCOSEGRAN_JWT_ALGORITMOS
        value: ES256,RS256
      - key: POSCOSEGRAN_JWT_AUDIENCIA
        value: authenticated
      - key: POSCOSEGRAN_JWT_EMISOR
        sync: false
      - key: POSCOSEGRAN_JWT_JWKS_URL
        sync: false
      - key: POSCOSEGRAN_AUTH_LOCAL_HABILITADA
        value: "false"
      - key: POSCOSEGRAN_CORS_ORIGENES
        sync: false
      - key: POSCOSEGRAN_BD_POOL_TAMANO
        value: "2"
      - key: POSCOSEGRAN_BD_POOL_DESBORDE
        value: "1"

  - type: web
    name: poscosegran-web
    runtime: static
    buildCommand: corepack enable && corepack prepare pnpm@10.24.0 --activate && pnpm install --frozen-lockfile && pnpm build
    staticPublishPath: ./dist
    autoDeployTrigger: commit
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: NODE_VERSION
        value: 22.14.0
      - key: VITE_AUTH_MODE
        value: supabase
      - key: VITE_API_URL
        value: https://poscosegran-api.onrender.com/api/v1
      - key: VITE_SUPABASE_URL
        sync: false
      - key: VITE_SUPABASE_ANON_KEY
        sync: false
